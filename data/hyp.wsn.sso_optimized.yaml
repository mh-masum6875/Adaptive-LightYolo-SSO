# SSO-Optimized Hyperparameters for WSN YOLO Training
# Generated using Sperm Swarm Optimization algorithm
# Optimized from YOLOv7-tiny baseline towards WSN-proven values

lr0: 0.010000  # initial learning rate
lrf: 0.100  # final OneCycleLR learning rate
momentum: 0.9370  # SGD momentum
weight_decay: 0.000500  # optimizer weight decay
warmup_epochs: 3.0  # warmup epochs
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr
box: 0.500  # box loss gain (SSO-optimized)
cls: 0.500  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.000  # obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.250  # IoU training threshold (SSO-optimized)
anchor_t: 4.0  # anchor-multiple threshold
fl_gamma: 0.000  # focal loss gamma
hsv_h: 0.015  # image HSV-Hue augmentation
hsv_s: 0.7  # image HSV-Saturation augmentation
hsv_v: 0.4  # image HSV-Value augmentation
degrees: 0.0  # image rotation
translate: 0.1  # image translation
scale: 0.900  # image scale (SSO-optimized)
shear: 0.0  # image shear
perspective: 0.0  # image perspective
flipud: 0.0  # image flip up-down
fliplr: 0.5  # image flip left-right
mosaic: 0.500  # image mosaic (SSO-optimized)
mixup: 0.100  # image mixup (SSO-optimized)
copy_paste: 0.0  # segment copy-paste
paste_in: 0.0  # image paste in
loss_ota: 1  # use ComputeLossOTA
