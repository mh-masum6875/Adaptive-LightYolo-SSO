# parameters
nc: 2  # number of classes
depth_multiple: 0.33  # model depth multiplier
width_multiple: 0.50  # layer channel multiplier
anchors:
  - [20,26, 32,60, 66,46]  # P3/8
  - [60,122, 124,90, 118,238]  # P4/16
  - [58,45, 78,99, 186,163]  # P5/32

# SSO-Optimized YOLO architecture for WSN
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [32, 3, 2, None, 1, nn.LeakyReLU(0.1)]],   # 0-P1/2
   [-1, 1, Conv, [64, 3, 2, None, 1, nn.LeakyReLU(0.1)]],   # 1-P2/4
   
   [-1, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 2
   [-2, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 3
   [-1, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 4
   [-1, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 5
   [[-1, -2, -3, -4], 1, Concat, [1]],  # cat backbone P3
   [-1, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 7-P3/8

   [-1, 1, MP, []],
   [-1, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 9
   [-2, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 10
   [-1, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 11
   [-1, 1, Conv, [64, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 12
   [[-1, -2, -3, -4], 1, Concat, [1]],  # cat backbone P4
   [-1, 1, Conv, [128, 1, 1, None, 1, nn.LeakyReLU(0.1)]],  # 14-P4/16

   [-1, 1, MP, []],
   [-1, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 16
   [-2, 1, Conv, [32, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 17
   [-1, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 18
   [-1, 1, Conv, [32, 3, 1, None, 1, nn.LeakyReLU(0.1)]],   # 19
   [[-1, -2, -3, -4], 1, Concat, [1]],  # cat backbone P5
   [-1, 1, Conv, [64, 1, 1, None, 1, nn.LeakyReLU(0.1)]],   # 21-P5/32
  ]

# YOLOv7 head
head:
  [[-1, 1, SPPCSPC, [256]], # 22
  
   [-1, 1, Conv, [128, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [14, 1, Conv, [128, 1, 1]], # route backbone P4
   [[-1, -2], 1, Concat, [1]],
   
   [-1, 1, Conv, [64, 1, 1]],
   [-2, 1, Conv, [64, 1, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [-1, 1, Conv, [64, 3, 1]],
   [[-1, -2, -3, -4], 1, Concat, [1]],
   [-1, 1, Conv, [128, 1, 1]], # 31

   [-1, 1, Conv, [64, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [7, 1, Conv, [64, 1, 1]], # route backbone P3
   [[-1, -2], 1, Concat, [1]],
   
   [-1, 1, Conv, [32, 1, 1]],
   [-2, 1, Conv, [32, 1, 1]],
   [-1, 1, Conv, [32, 3, 1]],
   [-1, 1, Conv, [32, 3, 1]],
   [[-1, -2, -3, -4], 1, Concat, [1]],
   [-1, 1, Conv, [64, 1, 1]], # 40

   [-1, 1, Conv, [128, 3, 1]],
   [31, 1, Conv, [256, 3, 1]],
   [22, 1, Conv, [512, 3, 1]],

   [[41, 42, 43], 1, IDetect, [nc, anchors]],   # Detect(P3, P4, P5)
  ] 